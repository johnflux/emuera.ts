name: Build and publish desktop releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=optional
      - run: npm run dist:win -- --publish never
      - name: Check packaged native bindings
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          & "./release/win-unpacked/Era.exe" -e "const {createRequire}=require('node:module'); const r=createRequire(require('node:path').resolve('release/win-unpacked/resources/app.asar/package.json')); r('@napi-rs/canvas'); r('@napi-rs/image'); console.log('Packaged native bindings loaded');"
          if ($LASTEXITCODE -ne 0) { throw "Packaged native bindings failed to load" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            !release/*.exe.blockmap
          if-no-files-found: error

  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            output: mac
          - runner: macos-latest
            arch: arm64
            output: mac-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=optional
      - run: npm run dist:mac:${{ matrix.arch }} -- --publish never
      - name: Check packaged native bindings
        env:
          ELECTRON_RUN_AS_NODE: "1"
          MAC_OUTPUT: ${{ matrix.output }}
        run: |
          "release/$MAC_OUTPUT/Era.app/Contents/MacOS/Era" -e "const {createRequire}=require('node:module'); const r=createRequire(require('node:path').resolve('release',process.env.MAC_OUTPUT,'Era.app/Contents/Resources/app.asar/package.json')); r('@napi-rs/canvas'); r('@napi-rs/image'); console.log('Packaged native bindings loaded');"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: |
            release/*.dmg
            release/*.zip
            !release/*.blockmap
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
